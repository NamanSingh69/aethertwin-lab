name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Private repositories need code scanning enabled (GitHub Code Security); opt in
    # with the repository variable CODE_SCANNING=true once it is. Public repos always run.
    if: ${{ !github.event.repository.private || vars.CODE_SCANNING == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # actions: read lets CodeQL look up its own run (required on private repositories).
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Committed build output and third-party references are not our source.
          config: |
            paths-ignore:
              - web/dist
              - references
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
