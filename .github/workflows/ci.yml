name: Software checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: requirements-windows.lock
          - os: ubuntu-24.04
            lock: requirements-ubuntu.lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      RUN_OBSERVED_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - name: Verify repository inventory
        run: python tools/repository_manifest.py --check
      - name: Install locked CPU dependencies
        run: python -m pip install --require-hashes -r ${{ matrix.lock }}
      - run: python -m pip check
      - name: Regression suite
        run: python -m pytest -q --junitxml=ci-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ runner.os }}
          path: ci-results.xml

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
