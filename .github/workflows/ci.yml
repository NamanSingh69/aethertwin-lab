name: Software checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lock: requirements-windows.lock
          - os: ubuntu-24.04
            lock: requirements-ubuntu.lock
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      RUN_OBSERVED_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - name: Verify repository inventory
        run: python tools/repository_manifest.py --check
      - name: Install locked CPU dependencies
        run: python -m pip install --require-hashes -r ${{ matrix.lock }}
      - run: python -m pip check
      - name: Regression suite
        run: python -m pytest -q --junitxml=ci-results.xml
      # Reports are a debugging aid: upload only on failure and never let a full
      # artifact quota fail an otherwise green run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: python-${{ runner.os }}
          path: ci-results.xml

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed web/dist matches a fresh build
        run: |
          git diff --exit-code --stat -- dist reports/production-startup.json
          untracked=$(git ls-files --others --exclude-standard -- dist)
          if [ -n "$untracked" ]; then echo "Untracked build output:"; echo "$untracked"; exit 1; fi
      - name: Bundle size budget
        run: npm run size
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Mocked end-to-end suite
        run: npm run e2e:mock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: playwright-mock
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ubuntu.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Linux runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - name: Install locked CPU dependencies
        run: python -m pip install --require-hashes -r requirements-ubuntu.lock
      - name: Start the simulator service
        run: |
          python -m command_center --mode sim --threads 2 --output "$RUNNER_TEMP/aethertwin" > "$RUNNER_TEMP/service.log" 2>&1 &
          for _ in $(seq 1 90); do
            # Loopback development mode: a local peer may read health without signing in.
            if curl -fsS http://127.0.0.1:8080/api/v2/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/service.log"; exit 1
      - name: Web dependencies
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Live end-to-end suite
        working-directory: web
        env:
          AETHERTWIN_SERVICE_URL: http://127.0.0.1:8080
        run: npx playwright test --project=live
      - name: Service log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/service.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: playwright-live
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
